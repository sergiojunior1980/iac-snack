version: "3.8"

services:
  agent:
    image: ${PORTAINER_AGENT_IMAGE:-portainer/agent:lts}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  portainer:
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:lts}
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=${NETWORK_PUBLIC:-network_public}
        - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST:?PORTAINER_HOST obrigatorio}`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.tls.certresolver=letsencryptresolver
        - traefik.http.routers.portainer.service=portainer
        - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  agent_network:
    driver: overlay
    attachable: true
  public:
    external: true
    name: ${NETWORK_PUBLIC:-network_public}

volumes:
  portainer_data:
    external: true
    name: portainer_data

